name: thej
# Local dev services. `pnpm infra:up` from the repo root.
# The audio bucket is created by the workers on startup (ensureBucket).
# `pnpm workers:up` also builds and runs the fetcher (+ bgutil) and analysis workers in Docker,
# so yt-dlp and ffmpeg don't need installing on the Mac. HOME_PROXY comes from the root .env.
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: thej, POSTGRES_PASSWORD: thej, POSTGRES_DB: thej }
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]

  # minio/minio is no longer published on Docker Hub; Chainguard's build is the same MinIO server.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment: { MINIO_ROOT_USER: thej, MINIO_ROOT_PASSWORD: thej-dev-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  bgutil:
    profiles: [workers]
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    init: true

  fetcher:
    profiles: [workers]
    build: { context: .., dockerfile: apps/workers/fetcher.Dockerfile }
    environment: &worker-env
      DATABASE_URL: postgres://thej:thej@postgres:5432/thej
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: audio
      S3_ACCESS_KEY_ID: thej
      S3_SECRET_ACCESS_KEY: thej-dev-secret
      HOME_PROXY: ${HOME_PROXY:-}
      FALLBACK_PROXY: ${FALLBACK_PROXY:-}
      BGUTIL_URL: http://bgutil:4416
    depends_on: [postgres, redis, minio, bgutil]

  analysis:
    profiles: [workers]
    build: { context: .., dockerfile: apps/workers/Dockerfile }
    command: ["node", "--import", "tsx", "src/analysis/index.ts"]
    environment: *worker-env
    depends_on: [postgres, redis, minio]

volumes:
  pg-data:
  minio-data:
