# Local dev services. `pnpm infra:up` from the repo root.
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: thej, POSTGRES_PASSWORD: thej, POSTGRES_DB: thej }
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment: { MINIO_ROOT_USER: thej, MINIO_ROOT_PASSWORD: thej-dev-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 thej thej-dev-secret; do sleep 1; done;
             mc mb -p local/audio"

volumes:
  pg-data:
  minio-data:
