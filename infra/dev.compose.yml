name: thej
# Local dev services. `pnpm infra:up` from the repo root.
# `pnpm workers:up` also builds and runs the streamer (+ bgutil) in Docker, so yt-dlp, ffmpeg and
# Essentia don't need installing on the Mac. HOME_PROXY comes from the root .env.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_USER: thej, POSTGRES_PASSWORD: thej, POSTGRES_DB: thej }
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]

  # minio/minio is no longer published on Docker Hub; Chainguard's build is the same MinIO server.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment: { MINIO_ROOT_USER: thej, MINIO_ROOT_PASSWORD: thej-dev-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  bgutil:
    profiles: [workers]
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    init: true

  # On-demand audio: resolve, pull through the home proxy, analyse, serve from ./.data/stream.
  # amd64 image (Essentia); emulated on Apple Silicon, so analysis takes ~40 s here vs ~5 s on the VPS.
  streamer:
    profiles: [workers]
    build: { context: .., dockerfile: apps/workers/streamer.Dockerfile }
    platform: linux/amd64
    environment:
      DATABASE_URL: postgres://thej:thej@postgres:5432/thej
      REDIS_URL: redis://redis:6379
      HOME_PROXY: ${HOME_PROXY:-}
      FALLBACK_PROXY: ${FALLBACK_PROXY:-}
      BGUTIL_URL: http://bgutil:4416
      STREAM_DIR: /data/stream
      STREAM_CONCURRENCY: "2"
    volumes:
      - ../.data/stream:/data/stream
    depends_on: [postgres, redis, bgutil]

volumes:
  pg-data:
  minio-data:
