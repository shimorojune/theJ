# The fetcher probe currently deployed on Dokploy (project "deejay", Compose "fetcher", raw YAML).
# It proved 10/10 downloads through the home IP (0/5 from the VPS directly).
# Superseded by thej.compose.yml once the real worker image exists; kept for reference.
#
# Dokploy > Compose > Environment:
#   TS_AUTHKEY      Tailscale auth key, created with tag:deejay-fetcher (not ephemeral)
#   HOME_PROXY_IP   home proxy's 100.x.y.z address (live: Umbrel's node, 100.104.87.114)
#   PROXY_PASS      same value as on the home stack
#   FALLBACK_PROXY  optional, residential proxy URL used when home is down (later)
services:
  tailscale:
    image: tailscale/tailscale:v1.104.2
    hostname: deejay-fetcher
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: deejay-fetcher
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - ts-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    # Same netns as the fetcher, bound to localhost only (server is unauthenticated).
    # yt-dlp's plugin forwards --proxy to it, so its YouTube requests also go out via home.
    network_mode: service:tailscale
    command: ["--host", "127.0.0.1"]
    init: true
    depends_on:
      - tailscale
    restart: unless-stopped

  fetcher:
    image: python:3.12-slim
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - bgutil
    environment:
      HOME_PROXY: socks5h://deejay:${PROXY_PASS}@${HOME_PROXY_IP}:1080
      FALLBACK_PROXY: ${FALLBACK_PROXY:-}
    command:
      - bash
      - -c
      - |
        set -u
        apt-get update -qq && apt-get install -y -qq ffmpeg curl >/dev/null
        pip install -q -U --pre "yt-dlp[default]" deno "bgutil-ytdlp-pot-provider==2.0.2"
        echo "yt-dlp $$(yt-dlp --version)"
        echo "VPS IP:            $$(curl -s -m 10 https://api.ipify.org)"
        echo "Egress via home:   $$(curl -s -m 15 -x "$$HOME_PROXY" https://api.ipify.org || echo PROXY UNREACHABLE)"
        ok=0; n=0
        for q in "Kesariya" "Levitating" "Gallan Goodiyaan" "Blinding Lights" "Badtameez Dil" \
                 "Tum Hi Ho" "Shape of You" "Kal Ho Naa Ho" "Peaches Justin Bieber" "Apna Bana Le"; do
          n=$$((n+1))
          if yt-dlp -q --no-warnings --no-playlist --proxy "$$HOME_PROXY" -f 140 \
               -o "/tmp/probe/%(id)s.%(ext)s" "ytsearch1:$$q official audio" 2>/tmp/err.txt; then
            ok=$$((ok+1)); echo "OK    $$q"
          else
            echo "FAIL  $$q :: $$(tail -n 1 /tmp/err.txt)"
          fi
          sleep $$((2 + RANDOM % 5))
        done
        echo "RESULT $$ok/$$n downloaded"; ls -la /tmp/probe 2>/dev/null
        yt-dlp -v --proxy "$$HOME_PROXY" --simulate "ytsearch1:Kesariya official audio" 2>&1 | grep -i "pot" | head -n 5
        sleep infinity
    restart: "no"

volumes:
  ts-state:
