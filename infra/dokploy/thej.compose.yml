# theJ v3 stack on Dokploy (Compose "fetcher" in project "deejay", built from this repo).
# Secrets come from Dokploy > Compose > Environment:
#   required: POSTGRES_PASSWORD, AUDIO_URL_SIGNING_SECRET, TS_AUTHKEY, HOME_PROXY_IP, PROXY_PASS
#   catalog:  OPENROUTER_API_KEY (tagging), JEV_API_KEY (later)
#   optional: CLERK_SECRET_KEY, FALLBACK_PROXY, DEV_AUTH_TOKEN (dev builds skip Clerk with x-dev-user + x-dev-token)
# api is the only service with a public domain (via Dokploy Traefik on dokploy-network).
# The compose keeps the probe's project name, so the Tailscale node identity (ts-state) carries over.
services:
  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    environment: &app-env
      DATABASE_URL: postgres://thej:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/thej
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      DEV_AUTH_TOKEN: ${DEV_AUTH_TOKEN:-}
      AUDIO_URL_SIGNING_SECRET: ${AUDIO_URL_SIGNING_SECRET:?set AUDIO_URL_SIGNING_SECRET}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://thej.rraj.dev}
      STREAM_DIR: /data/stream
      NODE_ENV: production
    volumes:
      - stream-data:/data/stream
    depends_on: &after-migrate
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    networks: [default, dokploy-network]
    restart: unless-stopped

  migrate:
    build: { context: ../.., dockerfile: apps/workers/Dockerfile }
    command: ["node", "--import", "tsx", "../../packages/db/src/migrate.ts"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure:5

  # One-shot catalog crawl + embed + tag on every deploy; idempotent, re-crawls playlists after 7 days.
  catalog:
    build: { context: ../.., dockerfile: apps/workers/Dockerfile }
    command: ["node", "--import", "tsx", "src/catalog/crawl.ts", "all"]
    environment:
      <<: *app-env
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TAG_SHARD: 0/1
    depends_on: *after-migrate
    restart: "no"
    # Background work yields to the api: low CPU weight and a hard cap.
    cpu_shares: 256
    cpus: "1.0"

  # Streamer, bgutil and tailscale share one network namespace. Tailscale also joins the
  # default network so the streamer can reach postgres and redis by name.
  tailscale:
    image: tailscale/tailscale:v1.104.2
    hostname: deejay-fetcher
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: deejay-fetcher
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes: [ts-state:/var/lib/tailscale]
    devices: [/dev/net/tun:/dev/net/tun]
    cap_add: [NET_ADMIN, NET_RAW]
    restart: unless-stopped

  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    network_mode: service:tailscale
    command: ["--host", "127.0.0.1"]
    init: true
    depends_on: [tailscale]
    restart: unless-stopped

  streamer:
    build: { context: ../.., dockerfile: apps/workers/streamer.Dockerfile }
    network_mode: service:tailscale
    environment:
      <<: *app-env
      HOME_PROXY: socks5h://deejay:${PROXY_PASS:?set PROXY_PASS}@${HOME_PROXY_IP:?set HOME_PROXY_IP}:1080
      FALLBACK_PROXY: ${FALLBACK_PROXY:-}
      STREAM_CONCURRENCY: "2"
      STREAM_KEEP_MIN: "2880"
    volumes:
      - stream-data:/data/stream
    depends_on:
      <<: *after-migrate
      tailscale: { condition: service_started }
      bgutil: { condition: service_started }
    restart: unless-stopped
    cpu_shares: 512
    cpus: "1.5"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: thej
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: thej
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thej -d thej"]
      interval: 5s
      retries: 12
    volumes: [pg-data:/var/lib/postgresql/data]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    restart: unless-stopped

volumes:
  ts-state:
  pg-data:
  redis-data:
  stream-data:

networks:
  dokploy-network:
    external: true
