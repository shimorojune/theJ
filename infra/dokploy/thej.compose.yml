# theJ production stack on Dokploy (target layout; build from repo once it's on GitHub).
# All secrets come from Dokploy > Compose > Environment. See .env.example for the full list.
# api is the only service with a public domain (via Dokploy Traefik on dokploy-network).
services:
  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    environment: &app-env
      DATABASE_URL: postgres://thej:${POSTGRES_PASSWORD}@postgres:5432/thej
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: audio
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      AUDIO_URL_SIGNING_SECRET: ${AUDIO_URL_SIGNING_SECRET}
    depends_on: [postgres, redis, minio]
    networks: [default, dokploy-network]
    restart: unless-stopped

  planner:
    build: { context: ../.., dockerfile: apps/workers/Dockerfile }
    command: ["node", "--import", "tsx", "src/planner/index.ts"]
    environment:
      <<: *app-env
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LLM_INTERPRET_MODEL: ${LLM_INTERPRET_MODEL}
      LLM_REFILL_MODEL: ${LLM_REFILL_MODEL}
    depends_on: [postgres, redis]
    restart: unless-stopped

  analysis:
    build: { context: ../.., dockerfile: apps/workers/Dockerfile }
    command: ["node", "--import", "tsx", "src/analysis/index.ts"]
    environment: *app-env
    depends_on: [postgres, redis, minio]
    restart: unless-stopped

  # Fetcher, bgutil and tailscale share one network namespace. Tailscale also joins the
  # default network so the fetcher can reach redis and minio by name.
  tailscale:
    image: tailscale/tailscale:v1.104.2
    hostname: deejay-fetcher
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: deejay-fetcher
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes: [ts-state:/var/lib/tailscale]
    devices: [/dev/net/tun:/dev/net/tun]
    cap_add: [NET_ADMIN, NET_RAW]
    restart: unless-stopped

  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    network_mode: service:tailscale
    command: ["--host", "127.0.0.1"]
    init: true
    depends_on: [tailscale]
    restart: unless-stopped

  fetcher:
    build: { context: ../.., dockerfile: apps/workers/fetcher.Dockerfile }
    network_mode: service:tailscale
    environment:
      <<: *app-env
      HOME_PROXY: socks5h://deejay:${PROXY_PASS}@${HOME_PROXY_IP}:1080
      FALLBACK_PROXY: ${FALLBACK_PROXY:-}
      FETCH_CONCURRENCY: "2"
    depends_on: [tailscale, bgutil, redis, minio]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: thej
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: thej
    volumes: [pg-data:/var/lib/postgresql/data]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    restart: unless-stopped

volumes:
  ts-state:
  pg-data:
  redis-data:
  minio-data:

networks:
  dokploy-network:
    external: true
